<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" height="100%">
  <!-- Estilos para los textos -->
  <style>
    .bg { fill: #050505; stroke: #6e1a1a; stroke-width: 2; }
    .text-main { fill: #ffffff; font-family: serif; font-size: 50px; font-weight: bold; }
    .text-vhs { fill: #ffffff; font-family: monospace; font-size: 16px; letter-spacing: 2px;}
    .barcode { fill: #ffffff; }
  </style>

  <!-- Fondo oscuro con borde rojo -->
  <rect x="2" y="2" width="996" height="146" class="bg" />

  <!-- AQUÍ VA TU GIF EN BASE64 -->
  <!-- Si tu código Base64 ya incluye "data:image/gif;base64," al inicio, no lo dupliques -->
  

  <!-- Texto Principal Central -->
  <text x="140" y="85" class="text-main">DALTTONS / DAIJO.DEV</text>

  <!-- Textos de esquina (Estilo VHS) -->
  <text x="20" y="30" class="text-vhs">PLAY ►</text>
  <text x="900" y="30" class="text-vhs">0:00:00</text>
  
  <text x="20" y="130" class="text-vhs">VHS 0:00:00</text>
  <text x="900" y="130" class="text-vhs">0:00:00</text>

  <!-- Códigos de barras simulados (Inferior centro) -->
  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="3" height="30" class="barcode" />
    <rect x="5" y="0" width="1" height="30" class="barcode" />
    <rect x="8" y="0" width="4" height="30" class="barcode" />
    <rect x="14" y="0" width="2" height="30" class="barcode" />
    <rect x="18" y="0" width="5" height="30" class="barcode" />
    <rect x="25" y="0" width="1" height="30" class="barcode" />
    <rect x="28" y="0" width="3" height="30" class="barcode" />
    <rect x="33" y="0" width="2" height="30" class="barcode" />
    <rect x="37" y="0" width="6" height="30" class="barcode" />
    <rect x="45" y="0" width="1" height="30" class="barcode" />
    <rect x="48" y="0" width="3" height="30" class="barcode" />
    <rect x="53" y="0" width="2" height="30" class="barcode" />
    <rect x="57" y="0" width="4" height="30" class="barcode" />
  </g>
  
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="4" height="30" class="barcode" />
    <rect x="6" y="0" width="1" height="30" class="barcode" />
    <rect x="9" y="0" width="3" height="30" class="barcode" />
    <rect x="14" y="0" width="2" height="30" class="barcode" />
    <rect x="18" y="0" width="4" height="30" class="barcode" />
    <rect x="24" y="0" width="1" height="30" class="barcode" />
    <rect x="27" y="0" width="3" height="30" class="barcode" />
    <rect x="32" y="0" width="2" height="30" class="barcode" />
    <rect x="36" y="0" width="5" height="30" class="barcode" />
    <rect x="43" y="0" width="1" height="30" class="barcode" />
    <rect x="46" y="0" width="3" height="30" class="barcode" />
    <rect x="51" y="0" width="2" height="30" class="barcode" />
    <rect x="55" y="0" width="3" height="30" class="barcode" />
  </g>

  <!-- Efecto Glitch Estático (Simulado con líneas) -->
  <line x1="20" y1="60" x2="60" y2="60" stroke="#6e1a1a" stroke-width="2" opacity="0.5" />
  <line x1="300" y1="120" x2="350" y2="120" stroke="#6e1a1a" stroke-width="1" opacity="0.7" />
</svg>